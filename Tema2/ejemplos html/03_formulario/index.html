<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>Formulario</h1>
    <form action="procesar.php" method="post">
        <p>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
        </p>
        <p>
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>
        </p>
        <p>
        <label for="fecha">Fecha nacimiento</label>    
        <input type="date" id="fecha" name="fecha">
        </p>
        <p>
        <label for="edad">NRE</label>    
        <input type="number" name="edad" id="edad">    
        </p>
        <p>
        <label for="ciclo">Ciclo</label>
        <select id="ciclo" name="ciclo">
            <option>ASIR</option>
            <option>DAM</option>
            <option>DAW</option>
        </select>
        </p>
        <p>
            <input type="radio" name="turno" id="diurno" 
                value="D">
            <label for="diurno">Diurno</label>
            <input type="radio" name="turno" id="vespertino" 
                value="V" checked>
            <label for="vespertino">Vespertino</label>
        </p>
        <p>
            <input type="checkbox" name="becas" id="becas">
            <label for="becas">Quiero información sobre becas</label>
        </p>
        <p>
           <textarea rows="5" placeholder="Observaciones..."></textarea> 
        </p>
        <p>
        <button type="submit">Enviar</button>
        <button type="reset">Resetear</button>
        </p>
    </form>
</body>
</html>
