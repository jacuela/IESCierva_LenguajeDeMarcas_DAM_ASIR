<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 5 · TecnoShop</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="cabecera">
    <h1>TecnoShop</h1>
    <p class="lema">Informática para el instituto</p>
  </div>

  <div class="producto">
    <h2>Teclado mecánico</h2>
    <p class="precio">59,90 €</p>
    <p>Teclas de color <span class="color">negro</span>.</p>
  </div>

  <div class="producto oferta">
    <h2>Ratón inalámbrico</h2>
    <p class="precio">19,90 € <span class="antes">24,50 €</span></p>
    <p>Disponible en <span class="color">blanco</span>.</p>
  </div>

  <p class="precio">Envío gratis a partir de 50 €</p>
</body>
</html>
